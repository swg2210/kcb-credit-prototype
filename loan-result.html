<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KCB 신용영향 요인 — 대출 조건</title>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --font: 'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
      --green-500: #09AB49;
      --green-100: #EEFFF2;
      --npay-green: #00DE5A;
      --gray-100: #F6F8FA;
      --gray-200: #EDEFF2;
      --gray-700: #767678;
      --gray-800: #404048;
      --gray-900: #1E1E23;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: #F0F2F5;
      color: var(--gray-900);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ─── Phone Shell ─── */
    .phone {
      width: 393px;
      height: 853px;
      background: #fff;
      border-radius: 28px;
      border: 1px solid var(--gray-200);
      box-shadow: 0 4px 32px -8px rgba(0,0,0,.14), 0 1px 6px -2px rgba(0,0,0,.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── Status bar ─── */
    .status-bar {
      height: 44px;
      flex-shrink: 0;
      background: #fff;
      position: relative;
    }
    .status-bar-inner {
      width: 375px;
      height: 44px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      overflow: hidden;
    }

    /* ─── Header close ─── */
    .header-close {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 20px;
      flex-shrink: 0;
    }
    .header-close__btn {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #000;
      font-size: 18px;
      line-height: 1;
      background: none;
      border: none;
    }

    /* ─── Naver Toolbar ─── */
    .naver-toolbar {
      width: 393px;
      height: 84px;
      flex-shrink: 0;
      background: #fff;
      position: relative;
    }

    /* ─── Scrollable body ─── */
    .phone-body {
      flex: 1;
      overflow-y: auto;
      padding: 11px 20px 0;
    }

    /* ─── Title area ─── */
    .title-area {
      margin-bottom: 32px;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -.03125em;
      color: #000;
      margin-bottom: 10px;
    }
    .title em {
      color: var(--green-500);
      font-style: normal;
    }
    .subtitle {
      font-size: .9375rem;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -.02em;
      color: var(--gray-700);
    }

    /* ─── Loan condition items (Figma 3172:2244) ─── */
    .loan-items {
      display: flex;
      flex-direction: column;
    }
    .loan-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 0;
    }
    .loan-item + .loan-item {
      border-top: 1px solid var(--gray-200);
    }
    .loan-item img {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
    }
    .loan-item__label {
      font-size: .9375rem;
      font-weight: 400;
      color: var(--gray-800);
      letter-spacing: -.02em;
      flex: 1;
    }
    .loan-item__value {
      font-size: .9375rem;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -.02em;
    }

    /* ─── Button area ─── */
    .btn-area {
      padding: 16px 20px 28px;
      flex-shrink: 0;
      background: #fff;
    }
    .btn-primary {
      display: block;
      width: 100%;
      height: 48px;
      background: var(--npay-green);
      border: none;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -.02em;
      color: #000;
      cursor: pointer;
      transition: filter .15s;
    }
    .btn-primary:hover { filter: brightness(.95); }
    .btn-primary:active { filter: brightness(.9); }
  </style>
</head>
<body>

  <div class="phone">

    <!-- Status bar -->
    <div class="status-bar">

        <div style="width:30px;height:30px;position:relative;flex-shrink:0;">

        </div>
        <div style="width:30px;height:30px;position:relative;flex-shrink:0;">
          <img src="https://www.figma.com/api/mcp/asset/fb497e52-9923-4c12-b7bb-37bec457e6a1" style="position:absolute;top:12px;left:5px;width:20.5px;height:7px;display:block;" alt="">

      </div>
      <div style="position:absolute;top:calc(50% + 30.5px);left:50%;transform:translate(-50%,-50%);width:143px;height:5px;background:#000;border-radius:4px;"></div>
    </div>

  </div><!-- /phone -->

</body>
</html>
